<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خدمة مدارس الأحد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="auth">
  <div class="float" id="float"></div>
  <div class="auth-card">
    <div class="logo"><i class="ic" data-ic="cross"></i></div>
    <h1>مدارس الأحد</h1>
    <p class="verse">««هأنذا أسأل عن غنمي وأفتقدها»
حز ٣٤ : ١١» <small></small></p>
    <input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email">
    <input id="pass" type="password" placeholder="كلمة المرور (٦ أحرف على الأقل)" autocomplete="current-password">
    <button class="btn primary" id="authBtn">تسجيل الدخول</button>
    <button class="btn ghost" id="googleBtn">الدخول بحساب Google</button>
    <a href="#" id="toggleAuth">ليس لديك حساب؟ أنشئ حساباً جديداً</a>
    <p class="err" id="authErr"></p>
    <p class="muted small" id="demoNote"></p>
  </div>
</section>

<div id="app" hidden>
  <aside>
    <div class="brand"><i class="ic" data-ic="cross"></i><span>مدارس الأحد</span></div>
    <nav>
      <button data-v="track" class="on"><i class="ic" data-ic="church"></i><span>المتابعة</span></button>
      <button data-v="board"><i class="ic" data-ic="crown"></i><span>لوحة الشرف</span></button>
      <button data-v="kids"><i class="ic" data-ic="book"></i><span>المخدومين</span></button>
      <button data-v="log" id="navLog" hidden><i class="ic" data-ic="log"></i><span>سجل النشاط</span></button>
    </nav>
    <p class="me" id="me"></p>
    <p class="aside-verse">«كُلُّ شَيْءٍ يَحْسُنُ وَبِحَسَبِ تَرْتِيبٍ»</p>
    <button class="out" id="logout"><i class="ic" data-ic="out"></i><span>خروج</span></button>
  </aside>
  <main>
    <header>
      <h2 id="title">المتابعة الأسبوعية</h2>
      <div class="tools">
        <input id="search" placeholder="بحث بالاسم">
        <select id="year"></select>
        <button class="btn primary" id="addKid">＋ ولد جديد</button>
        <button class="btn ghost" id="csv">تصدير Excel</button>
      </div>
    </header>
    <section id="stats"></section>
    <section id="v-track" class="view">
      <div class="months" id="months"></div>
      <div class="legend" id="legend"></div>
      <div class="scroll"><table id="tbl"></table></div>
    </section>
    <section id="v-board" class="view" hidden><div id="podium"></div><div class="scroll"><table id="rank"></table></div></section>
    <section id="v-log" class="view" hidden><p class="logtop" id="logTop"></p><div class="scroll"><table id="logTbl"></table></div></section>
    <section id="v-kids" class="view" hidden><div id="grid"></div></section>
  </main>
</div>

<dialog id="dlg">
  <form method="dialog" id="kidForm">
    <div class="dhead"><h3 id="dTitle">بطاقة المخدوم</h3><button type="button" class="x" id="closeDlg">✕</button></div>
    <div class="dbody">
      <label class="photo"><img id="pPrev" alt=""><span>تغيير الصورة</span><input type="file" id="pFile" accept="image/*" hidden></label>
      <div class="fields">
        <h4 class="sec full">البيانات الشخصية</h4>
        <label class="full">الاسم رباعي<input name="name" required></label>
        <label>تاريخ الميلاد<input name="birth" type="date"></label>
        <label>السنة الدراسية<input name="grade"></label>
        <label class="full">العنوان<input name="address"></label>
        <h4 class="sec full">التواصل والأسرة</h4>
        <label>تليفون الولد<input name="phoneS" type="tel"></label>
        <label>تليفون الأب<input name="phoneF" type="tel"></label>
        <label>تليفون الأم<input name="phoneM" type="tel"></label>
        <label>وظيفة الأب<input name="jobF"></label>
        <label>وظيفة الأم<input name="jobM"></label>
        <label>الأخوات<input name="siblings" placeholder="مثال: مريم، يوستينا"></label>
        <label class="full">تواريخ ميلاد الأخوات<input name="siblingsBirth" placeholder="مثال: مريم 12/3/2012 ، يوستينا 5/9/2015"></label>
        <h4 class="sec full">المتابعة الروحية</h4>
        <label>أب اعتراف الولد<input name="confS"></label>
        <label>أب اعتراف الأب<input name="confF"></label>
        <label>أب اعتراف الأم<input name="confM"></label>
        <label class="full">ملاحظات خادم الفصل (سلوكية / صحية)<textarea name="notes" rows="3"></textarea></label>
      </div>
    </div>
    <div class="dfoot"><button class="btn danger" type="button" id="delKid">حذف</button><span class="muted small" id="lastEd"></span><button class="btn primary" value="save">حفظ البطاقة</button></div>
  </form>
</dialog>
<dialog id="pw"><form method="dialog" id="pwForm" class="pwf"><h3>تأكيد الصلاحية</h3><p class="muted small" id="pwMsg"></p><input id="pwIn" type="password" placeholder="كلمة السر" autocomplete="off"><p class="err" id="pwErr"></p><div class="pwb"><button class="btn primary" value="ok">تأكيد</button><button class="btn ghost" type="button" id="pwNo">إلغاء</button></div></form></dialog>
<div id="toast"></div>
<script src="script.js" defer></script>
</body>
</html>
